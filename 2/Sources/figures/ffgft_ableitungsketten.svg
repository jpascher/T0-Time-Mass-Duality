<svg width="680" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- ξ root -->
<rect x="285" y="20" width="110" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489">ξ = 4/30000</text>

<!-- mₑ -->
<rect x="20" y="110" width="130" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="85" y="126" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">mₑ (PDG)</text>
<text x="85" y="143" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">Anker [SETZUNG]</text>

<!-- α-Zweig -->
<rect x="190" y="110" width="130" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="255" y="126" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#3C3489">α-Zweig</text>
<text x="255" y="143" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">Dok. 011, 070 [K]</text>

<!-- G-Zweig -->
<rect x="360" y="110" width="130" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="425" y="126" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">G-Zweig</text>
<text x="425" y="143" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">Dok. A145 [K]</text>

<!-- Arrows ξ → branches -->
<line x1="310" y1="64" x2="140" y2="110" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="330" y1="64" x2="280" y2="110" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="360" y1="64" x2="400" y2="110" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

<!-- G status -->
<rect x="520" y="110" width="140" height="44" rx="6" fill="none" stroke="#bbb" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="527" y="126" dominant-baseline="central" font-size="11" fill="#444">✓ modellfrei</text>
<text x="527" y="143" dominant-baseline="central" font-size="11" fill="#444">σ = 2×10⁻⁵</text>

<!-- mμ -->
<rect x="20" y="210" width="130" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="85" y="226" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">mμ (pred)</text>
<text x="85" y="243" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">(mμ/mₑ)² = 43200 [B]</text>
<line x1="85" y1="154" x2="85" y2="210" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

<!-- α status -->
<rect x="190" y="210" width="130" height="44" rx="6" fill="none" stroke="#bbb" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="197" y="226" dominant-baseline="central" font-size="11" fill="#555">⚠ Rb/Cs 5σ</text>
<text x="197" y="243" dominant-baseline="central" font-size="11" fill="#555">⚠ HFS ∝ α²</text>
<line x1="255" y1="154" x2="255" y2="210" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

<!-- mτ -->
<rect x="20" y="305" width="130" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="85" y="321" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">mτ (pred)</text>
<text x="85" y="338" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">mτ/mμ = 16.992 [K]</text>
<line x1="85" y1="254" x2="85" y2="305" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

<!-- mτ status -->
<rect x="190" y="305" width="130" height="44" rx="6" fill="none" stroke="#bbb" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="197" y="321" dominant-baseline="central" font-size="11" fill="#444">✓ BESIII/Belle II</text>
<text x="197" y="338" dominant-baseline="central" font-size="11" fill="#444">0.4σ, offen</text>
<line x1="150" y1="327" x2="190" y2="327" stroke="#aaa" stroke-width="0.7" stroke-dasharray="3 2"/>

<!-- v -->
<rect x="20" y="400" width="130" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="85" y="416" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#712B13">v (pred)</text>
<text x="85" y="433" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">mₑ/((4/3)·ξ^3/2) [K]</text>
<line x1="85" y1="349" x2="85" y2="400" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

<!-- v status -->
<rect x="190" y="400" width="130" height="44" rx="6" fill="none" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="197" y="416" dominant-baseline="central" font-size="11" fill="#c0392b">✗ kein Observable</text>
<text x="197" y="433" dominant-baseline="central" font-size="11" fill="#555">SM-Definition [Q]</text>
<line x1="150" y1="422" x2="190" y2="422" stroke="#aaa" stroke-width="0.7" stroke-dasharray="3 2"/>

<!-- G_F -->
<rect x="20" y="490" width="130" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="85" y="514" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#712B13">G_F, τ_μ, τ_n (pred)</text>
<line x1="85" y1="444" x2="85" y2="490" stroke="#444" stroke-width="1" marker-end="url(#arrow)"/>

<!-- G_F status -->
<rect x="190" y="490" width="130" height="40" rx="6" fill="none" stroke="#bbb" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="197" y="505" dominant-baseline="central" font-size="11" fill="#555">⚠ Δq=−0.44%</text>
<text x="197" y="520" dominant-baseline="central" font-size="11" fill="#555">192π³, √2 irrational</text>
<line x1="150" y1="510" x2="190" y2="510" stroke="#aaa" stroke-width="0.7" stroke-dasharray="3 2"/>

<!-- Galois: mₑ·mμ = 54 -->
<rect x="360" y="210" width="160" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<text x="440" y="228" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#27500A">mₑ·mμ = 54 MeV²</text>
<text x="440" y="246" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3B6D11">Rest −0.016% ≈ 1.2·ξ [K]</text>
<text x="440" y="261" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#639922">SI-Projektion-Ordnung</text>
<line x1="150" y1="128" x2="360" y2="228" stroke="#3B6D11" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<line x1="150" y1="235" x2="360" y2="238" stroke="#3B6D11" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

<!-- Galois: (mμ/mₑ)² = 43200 -->
<rect x="360" y="305" width="160" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="440" y="323" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">(mμ/mₑ)² = 43200</text>
<text x="440" y="341" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">Rest −1.034% ≈ 78·ξ [B]</text>
<text x="440" y="356" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#BA7517">fraktal-rekursiv (offen [S])</text>
<line x1="150" y1="240" x2="360" y2="333" stroke="#854F0B" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

<!-- Legend -->
<rect x="530" y="265" width="140" height="130" rx="6" fill="none" stroke="#bbb" stroke-width="0.7"/>
<text x="542" y="282" dominant-baseline="central" font-size="12" font-weight="500" fill="#333">Legende</text>
<rect x="542" y="296" width="10" height="10" rx="2" fill="none" stroke="#bbb" stroke-width="0.8" stroke-dasharray="4 2"/>
<text x="558" y="301" dominant-baseline="central" font-size="11" fill="#555">Vergleichswert (extern)</text>
<line x1="542" y1="320" x2="552" y2="320" stroke="#888" stroke-width="0.7" stroke-dasharray="4 3"/>
<text x="558" y="320" dominant-baseline="central" font-size="11" fill="#555">Galois-Identität</text>
<text x="542" y="340" dominant-baseline="central" font-size="11" fill="#226622">✓ sauber / modellfrei</text>
<text x="542" y="358" dominant-baseline="central" font-size="11" fill="#996600">⚠ Theorie-abhängig</text>
<text x="542" y="376" dominant-baseline="central" font-size="11" fill="#c0392b">✗ kein Observable</text>

</svg>
