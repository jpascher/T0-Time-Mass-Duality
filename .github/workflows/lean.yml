name: Lean-Prüfung

on:
  push:
    paths:
      - "2/lean/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

jobs:
  dok339-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: 2/lean/Dok339_Pilot
          use-mathlib-cache: false
          build: true
          test: false
          lint: false
